<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#a8c9cc">
<title>Strawboat</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="alternate icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="favicon.png?v=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8c9cc;font-family:ui-rounded,system-ui,sans-serif;color:#5d607f}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#launch{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#bfcfdc,#8db8c0);z-index:2}
.panel{text-align:center;background:#fffbef;padding:30px 38px 34px;border:3px solid #fff;border-radius:28px;box-shadow:0 6px 0 #adaabd,0 13px 25px #405d6a25;max-width:80vw}
h1{margin:0 0 19px;font-size:34px;letter-spacing:-1px}button{font:700 19px ui-rounded,system-ui,sans-serif;color:#5d607f;background:#dff0dd;border:2px solid #fff;padding:13px 36px;border-radius:19px;box-shadow:0 4px 0 #b6c7b7;cursor:pointer}button:disabled{cursor:wait;opacity:.65}#status{font-size:13px;margin:19px 0 0;color:#878aa0}progress{width:200px;height:7px;accent-color:#edba76;display:block;margin:0 auto 22px}#error{white-space:pre-wrap;max-width:400px;font-size:14px;color:#a65e68}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser needs WebGL 2 to play Strawboat.</canvas>
<div id="launch"><div class="panel"><h1>Strawboat</h1><progress id="progress"></progress><button id="play" hidden disabled>Play</button><p id="status">Preparing your boat</p><p id="error"></p></div></div>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas=document.getElementById('canvas');
const play=document.getElementById('play'),bar=document.getElementById('progress'),status=document.getElementById('status');
config.canvas=canvas;
config.onProgress=(current,total)=>{
 if(total){bar.max=total;bar.value=current;}
 else bar.removeAttribute('value');
};
const engine = new Engine(config);
const executable=config.executable;
const pack=config.mainPack || `${executable}.pck`;
let ready=false;
// Download and initialize the runtime without starting the game clock or audio.
Promise.all([engine.init(executable),engine.preloadFile(pack,pack)]).then(()=>{
 ready=true;bar.style.display='none';status.textContent='Ready to sail';
 play.disabled=false;play.hidden=false;
}).catch(showError);
play.addEventListener('click',async()=>{
 if(!ready)return;
 ready=false;play.disabled=true;play.textContent='Setting sail…';status.textContent='';
 try {
  // start() reuses the prepared runtime and pack; no second resource download.
  await engine.start({args:['--main-pack',pack,...(config.args || [])]});
  document.getElementById('launch').remove();canvas.focus();
 }catch(error){showError(error);}
});
function showError(error){
 ready=false;play.hidden=true;bar.style.display='none';
 document.getElementById('error').textContent=String(error);status.textContent='Unable to load';
}
</script>
</body>
</html>
